<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Qwen for Copilot Chat">
  <defs>
    <linearGradient id="bg" x1="40" y1="24" x2="472" y2="488" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="0.52" stop-color="#6D28D9"/>
      <stop offset="1" stop-color="#C026D3"/>
    </linearGradient>
    <linearGradient id="sheen" x1="256" y1="0" x2="256" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.26"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- app tile -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#sheen)"/>

  <!-- chat bubble with tail -->
  <path fill="#FFFFFF" fill-rule="evenodd"
        d="M188 108
           H324
           A76 76 0 0 1 400 184
           V268
           A76 76 0 0 1 324 344
           H292
           L176 428
           L214 344
           H188
           A76 76 0 0 1 112 268
           V184
           A76 76 0 0 1 188 108
           Z"/>

  <!-- Q -->
  <g fill="none" stroke="#6D28D9" stroke-width="26" stroke-linecap="round">
    <circle cx="256" cy="206" r="56"/>
    <path d="M296 246 L338 288"/>
  </g>
</svg>
